name: Vérification Python et Qt

on:
  push:
    branches:
      - work/drama-stabilisation-multisource
      - work/drama-mvp-generaliste
      - work/drama-extracteurs-verification
  pull_request:
    branches:
      - master
      - work/drama-stabilisation-multisource
      - work/drama-mvp-generaliste

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m compileall -q app.py engine.py dramafren_downloader.py sources.py browser_session.py tests
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
